<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbf1e7">
  <title>AMORA Box | Made With Love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --cream:#fbf1e7; --brown:#3a1c10; --gold:#a77b45; --pink:#d99a9a; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; overflow-x:hidden;
      font-family:'Cairo',sans-serif; color:var(--brown);
      background:
        linear-gradient(135deg, rgba(251,241,231,.90), rgba(251,241,231,.96)),
        url('amora-brand.jpg') center 38% / cover fixed;
      padding:28px 16px;
    }
    .sparkles { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
    .sparkle { position:absolute; color:var(--gold); opacity:0; animation:float 7s linear infinite; }
    .sparkle:nth-child(1){left:8%;top:80%;animation-delay:0s}
    .sparkle:nth-child(2){left:88%;top:70%;animation-delay:1.5s}
    .sparkle:nth-child(3){left:20%;top:35%;animation-delay:3s}
    .sparkle:nth-child(4){left:78%;top:25%;animation-delay:4.5s}
    .sparkle:nth-child(5){left:50%;top:90%;animation-delay:2.2s}
    @keyframes float { 0%{transform:translateY(20px) scale(.5) rotate(0);opacity:0} 15%{opacity:.65} 85%{opacity:.5} 100%{transform:translateY(-75vh) scale(1.2) rotate(35deg);opacity:0} }
    .card {
      width:min(100%,440px); text-align:center; padding:30px 25px 28px;
      background:rgba(255,250,245,.76); border:1px solid rgba(167,123,69,.28);
      border-radius:30px; box-shadow:0 22px 70px rgba(74,42,24,.13);
      backdrop-filter:blur(9px); animation:enter 1s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes enter { from{opacity:0;transform:translateY(28px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
    .logo { width:170px; height:170px; object-fit:cover; border-radius:50%; border:1px solid rgba(167,123,69,.22); box-shadow:0 8px 28px rgba(74,42,24,.10); }
    h1 { font:600 38px 'Playfair Display',serif; letter-spacing:8px; margin:15px 0 0; direction:ltr; }
    .tagline { color:var(--gold); font-size:14px; letter-spacing:4px; margin:1px 0 12px; direction:ltr; }
    .intro { font-size:14px; color:#795b49; margin:14px 0 23px; }
    .links { display:grid; gap:13px; }
    .link {
      display:flex; align-items:center; justify-content:center; gap:12px; min-height:58px;
      text-decoration:none; border:1px solid rgba(167,123,69,.38); border-radius:17px;
      background:rgba(255,255,255,.72); color:var(--brown); font-weight:700;
      transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
      box-shadow:0 5px 15px rgba(74,42,24,.05);
    }
    .link:hover { transform:translateY(-4px); background:#fff; box-shadow:0 12px 24px rgba(74,42,24,.12); }
    .icon { font-size:22px; }
    .footer { margin:23px 0 0; color:#9b7b64; font-size:11px; letter-spacing:3px; direction:ltr; }
    .heart { display:inline-block; color:var(--pink); animation:beat 1.5s ease-in-out infinite; }
    @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
    @media(max-width:380px){ .card{padding:24px 17px} .logo{width:145px;height:145px} h1{font-size:32px} }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true">
    <span class="sparkle">✦</span><span class="sparkle">♡</span><span class="sparkle">✧</span><span class="sparkle">♡</span><span class="sparkle">✦</span>
  </div>
  <main class="card">
    <img class="logo" src="amora-brand.jpg" alt="AMORA Box logo">
    <h1>AMORA</h1>
    <p class="tagline">BOX · MADE WITH LOVE</p>
    <p class="intro">كل روابطنا في مكان واحد ♡ اختار منصتك المفضلة</p>
    <nav class="links" aria-label="AMORA social links">
      <a class="link" href="https://whatsapp.com/channel/0029Vb8GzkIHLHQb7i0Asn3q" target="_blank" rel="noopener noreferrer"><span class="icon">💬</span> قناة WhatsApp</a>
      <a class="link" href="https://www.instagram.com/amora_box_offical?utm_source=qr" target="_blank" rel="noopener noreferrer"><span class="icon">📸</span> Instagram</a>
      <a class="link" href="https://www.tiktok.com/@amooraboox69?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener noreferrer"><span class="icon">🎵</span> TikTok</a>
    </nav>
    <p class="footer">MADE WITH <span class="heart">♥</span> BY AMORA</p>
  </main>
</body>
</html>
